{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name|default:"Library" }} | Login</title>
    <meta name="theme-color" content="#3a808a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="{% static 'frontend/favicon.svg' %}" type="image/svg+xml" />
    <link rel="icon" href="{% static 'frontend/favicon-32x32.png' %}" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="{% static 'frontend/apple-touch-icon.png' %}" />
    <link rel="manifest" href="{% static 'frontend/site.webmanifest' %}" />
    <link href="{% static 'frontend/login.css' %}" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="{% static 'frontend/login.js' %}"></script>
